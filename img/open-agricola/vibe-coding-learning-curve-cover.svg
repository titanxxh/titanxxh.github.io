<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Open Agricola Vibe Coding learning curve</title>
  <desc id="desc">A luminous curve rises, drops, and climbs again above a board-game landscape, moving from moonlight toward dawn.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1318"/>
      <stop offset="0.55" stop-color="#13242a"/>
      <stop offset="1" stop-color="#243c37"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263b33"/>
      <stop offset="1" stop-color="#101917"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8bd72"/>
      <stop offset="0.48" stop-color="#d98963"/>
      <stop offset="1" stop-color="#73c5a4"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe1a2" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffe1a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020606" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#sky)"/>
  <circle cx="1320" cy="180" r="270" fill="url(#dawn)"/>
  <circle cx="205" cy="155" r="62" fill="#e5d7b8" opacity="0.86"/>
  <circle cx="232" cy="132" r="63" fill="#0d171c"/>

  <path d="M0 650 C230 570 430 640 650 610 C900 575 1120 500 1600 575 L1600 900 L0 900 Z" fill="url(#land)"/>
  <path d="M0 735 C260 665 430 760 700 700 C970 640 1240 645 1600 690" fill="none" stroke="#5d7d6d" stroke-width="3" opacity="0.46"/>
  <path d="M0 805 C290 745 520 830 790 772 C1110 705 1370 760 1600 755" fill="none" stroke="#5d7d6d" stroke-width="3" opacity="0.36"/>

  <g opacity="0.72" filter="url(#shadow)">
    <path d="M170 695 L390 648 L478 715 L252 765 Z" fill="#9a7545" stroke="#d6a861" stroke-width="4"/>
    <path d="M270 675 L288 753 M335 662 L352 739 M205 706 L424 666 M230 732 L450 690" stroke="#d9b779" stroke-width="3" opacity="0.7"/>
    <path d="M1210 620 L1408 593 L1472 650 L1268 681 Z" fill="#466b53" stroke="#77a982" stroke-width="4"/>
    <path d="M1290 609 L1306 670 M1350 601 L1367 661 M1238 628 L1432 604 M1254 651 L1450 628" stroke="#91bc8f" stroke-width="3" opacity="0.68"/>
  </g>

  <g transform="translate(670 455)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="170" rx="20" fill="#172329" stroke="#78998e" stroke-width="5"/>
    <rect x="20" y="20" width="220" height="124" rx="10" fill="#0b1115"/>
    <path d="M42 111 C77 54 112 47 143 92 C165 125 192 105 222 49" fill="none" stroke="url(#curve)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="143" cy="92" r="8" fill="#d98963"/>
    <path d="M105 170 L155 170 L171 207 L89 207 Z" fill="#78998e"/>
    <rect x="55" y="205" width="150" height="18" rx="9" fill="#98b6aa"/>
  </g>

  <path d="M95 585 C240 480 330 210 520 220 C690 230 720 670 925 672 C1125 675 1230 430 1510 315" fill="none" stroke="#07100f" stroke-width="28" stroke-linecap="round" opacity="0.42"/>
  <path d="M95 585 C240 480 330 210 520 220 C690 230 720 670 925 672 C1125 675 1230 430 1510 315" fill="none" stroke="url(#curve)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>

  <g filter="url(#glow)">
    <circle cx="95" cy="585" r="15" fill="#e8bd72"/>
    <circle cx="520" cy="220" r="22" fill="#f1c06d"/>
    <circle cx="925" cy="672" r="22" fill="#d98963"/>
    <circle cx="1510" cy="315" r="22" fill="#73c5a4"/>
  </g>

  <g opacity="0.78">
    <circle cx="112" cy="298" r="3" fill="#f3dfb2"/>
    <circle cx="332" cy="115" r="4" fill="#f3dfb2"/>
    <circle cx="765" cy="132" r="3" fill="#f3dfb2"/>
    <circle cx="990" cy="225" r="4" fill="#f3dfb2"/>
    <circle cx="1450" cy="105" r="3" fill="#f3dfb2"/>
  </g>
</svg>
