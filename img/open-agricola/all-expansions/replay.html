<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一个工人，两座农场 · 碎石锤</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light; --paper:#f7f3e8; --ink:#283026; --muted:#5c6456; --rule:#c6c7b5; --green:#325a48; --rust:#8a472f; --serif:"Noto Serif CJK SC","Songti SC",SimSun,serif; }
body { margin:0; padding:clamp(12px,3vw,32px); background:#e7e6d9; color:var(--ink); font:16px/1.5 "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; }
main { max-width:940px; margin:auto; padding:clamp(16px,3.2vw,40px); background:var(--paper); border:1px solid var(--rule); box-shadow:0 5px 22px #39422b0e; }
header { display:flex; align-items:center; gap:16px; padding-bottom:17px; }
header img { width:68px; height:68px; object-fit:contain; }
h1,h2,h3,p,figure { margin:0; }
h1,h2,h3 { font-family:var(--serif); }
h1 { font-size:clamp(25px,4.5vw,48px); line-height:1.18; letter-spacing:.01em; }
.kicker { color:var(--green); font-size:13px; font-weight:700; letter-spacing:.16em; margin-bottom:5px; }
button { cursor:pointer; color:var(--ink); font:inherit; border:1px solid #a5ad99; background:transparent; }
button:focus-visible { outline:3px solid #ae661d; outline-offset:3px; }
button:disabled { opacity:.4; cursor:default; }
.modes { display:flex; gap:4px; border-bottom:1px solid var(--rule); }
.mode { padding:7px 13px 9px; font-size:15px; border:0; border-bottom:3px solid transparent; border-radius:0; }
.mode[aria-pressed="true"] { border-color:var(--green); color:var(--green); font-weight:700; }
.board { margin-top:17px; display:grid; grid-template-columns:1fr 1fr; gap:12px; position:relative; }
.farm { --side:var(--green); background:#edf0e4; border:1px solid #c3c8b4; border-top:4px solid #abb3a0; border-radius:4px; min-width:0; padding:13px 15px 12px; }
.farm:nth-child(2) { --side:var(--rust); background:#f4ebdc; }
.farm.active { border-top-color:var(--side); }
.farm-head,.land { display:flex; align-items:center; gap:7px; }
.farm-head { justify-content:space-between; min-height:28px; }
.farm h2 { font-size:clamp(17px,2.6vw,23px); line-height:1.25; }
.turn { visibility:hidden; font-size:12px; font-weight:650; color:var(--side); white-space:nowrap; }
.active .turn { visibility:visible; }
.land { margin:11px 0 6px; gap:3px; }
.tile { height:clamp(31px,5.8vw,56px); aspect-ratio:1; position:relative; border-radius:3px; }
.tile > img { width:100%; height:100%; object-fit:contain; display:block; }
.tile.empty { border:1px dashed #a8af97; background:#ffffff25; }
.tile.empty img { visibility:hidden; }
.field { margin-left:5px; display:grid; place-items:center; }
.field .crop { position:absolute; width:40%; height:40%; object-fit:contain; }
.field .crop:nth-child(2) { left:18%; top:44%; }
.field .crop:nth-child(3) { left:43%; top:43%; }
.field .crop:nth-child(4) { left:31%; top:22%; }
.farm-summary { color:#475043; font-size:14px; min-height:21px; }
.stock { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:10px; padding-top:8px; border-top:1px solid #49574130; }
.supply { display:inline-flex; align-items:center; gap:3px; font-size:13px; font-variant-numeric:tabular-nums; }
.supply img { width:15px; height:16px; object-fit:contain; }
.supply b { font-weight:700; }
.supply.changed { color:#183c29; box-shadow:inset 0 -2px #a28c48; }
.note { min-height:132px; padding:18px 0 16px; }
h3 { font-size:clamp(22px,3.5vw,33px); line-height:1.4; }
.note p { margin-top:5px; font-size:clamp(15px,1.8vw,18px); max-width:46em; line-height:1.65; }
.hand { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); display:flex; align-items:stretch; justify-content:space-around; padding:8px 0; gap:3px; }
figure { display:flex; flex:1; min-width:0; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; border-radius:4px; padding:4px 1px; }
figure img { width:clamp(36px,5vw,52px); aspect-ratio:1; object-fit:contain; opacity:.68; }
figcaption { font-size:12px; color:var(--muted); margin-top:4px; }
figure.lit { box-shadow:inset 0 -2px var(--green); background:#e1e7d7; }
figure.lit img { opacity:1; }
figure.lit figcaption { font-weight:700; color:#264635; }
footer { margin-top:15px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.buttons { display:flex; gap:6px; }
.buttons button { border-radius:4px; padding:6px 12px; font-size:14px; min-height:38px; }
#play { background:var(--green); border-color:var(--green); color:white; min-width:77px; }
#count { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.food-flight { position:absolute; pointer-events:none; width:27px; height:27px; z-index:2; filter:drop-shadow(0 2px 2px #402b2a44); }
.film .modes,.film .buttons { display:none; }
.film .chapter { display:block; color:var(--green); border-bottom:1px solid var(--rule); font-size:17px; font-weight:700; padding-bottom:9px; }
.chapter { display:none; }
.film body { padding:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); }
.film main { width:100%; max-width:1160px; min-height:682px; border:0; box-shadow:none; padding:24px 36px; }
.film .note { min-height:146px; }
.film footer { justify-content:flex-end; margin-top:6px; }
@media(max-width:590px) {
 body { padding:0; } main { border:0; padding:16px 12px; }
 header { gap:10px; padding-bottom:12px; } header img { width:48px;height:48px; }
 .kicker { font-size:11px; } .board { gap:6px; margin-top:12px; } .farm { padding:8px 7px; }
 .farm-head { flex-wrap:wrap; gap:0 4px; } .turn { font-size:10px; }
 .stock { gap:3px 7px; min-height:45px; } .supply { font-size:11px; } .supply img { width:11px; height:12px; }
 .land { gap:1px; } .field { margin-left:2px; } .tile { height:clamp(23px,7vw,38px); }
 .farm-summary { font-size:12px; } .note { min-height:134px; padding:13px 0; }
 .hand { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); justify-content:initial; gap:3px; }
 figure { flex-direction:row; justify-content:center; gap:3px; } figure img { width:25px; } figcaption { margin:0; font-size:11px; }
 .buttons button { padding:5px 9px; }
}
@media (max-width:590px) {
 html:lang(en) .hand { grid-template-columns:repeat(3,minmax(0,1fr)); }
 html:lang(en) .modes button { flex:1; }
 html:lang(en) .kicker { letter-spacing:.03em; }
 html:lang(en) .note { min-height:156px; }
}
.embedded body { padding:0; background:var(--paper); }
.embedded main { display:flex; flex-direction:column; max-width:none; padding:clamp(12px,2.5vw,20px); box-shadow:none; border:1px solid var(--rule); border-radius:6px; }
.embedded header, .embedded .modes, .embedded #play { display:none; }
.embedded footer { order:-1; margin:0; }
.embedded .buttons button { min-height:44px; }
.embedded #next { background:var(--green); border-color:var(--green); color:white; }
.embedded .hand { border-bottom:0; }
@media (max-width:480px) {
 .embedded footer, .embedded .note { padding-right:22px; }
}
</style>

<header><img id="hammer" alt=""><div><p class="kicker">全扩上桌 · 碎石锤</p><h1>一个工人，两座农场</h1></div></header>

const select = selector => document.querySelector(selector);

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
if (english) {

 select('nav').setAttribute('aria-label','Choose a game');
 modes[0].textContent = 'Round eight in the trailer';

 select('.hand').setAttribute('aria-label','Cards involved. Highlighted cards resolve in this step.');

 const translated = {

 for (const [caseName, steps] of Object.entries(translated)) {
  steps.forEach(([title, text], i) => Object.assign(tracks[caseName][i], {title, text}));

const farms = (english ? ['My farm','Opponent’s farm'] : ['我的农场','对面农场']).map(name => {
 const panel = make('section','farm');
 const head = make('div','farm-head');
 const title = make('h2',''); title.textContent = name;
 const turn = make('span','turn'); turn.textContent = english ? 'Active' : '结算中';
 head.append(title,turn);
 const land = make('div','land');
 const tiles = Array.from({length:3},() => {
  const tile = make('div','tile empty'); tile.append(img('clay-room')); land.append(tile); return tile;
 });
 const field = make('div','tile field'); field.append(img('field')); land.append(field);
 const summary = make('p','farm-summary');
 const stock = make('div','stock');
 panel.append(head,land,summary,stock); select('.board').append(panel);
 return {panel,tiles,field,summary,stock};

const promoCards = ['D014','A123','A178','D128','D096','B059','D175'];
let track, step, timer;
function motion(el, frames, duration=260, delay=0) {
 if (!reduced.matches) el.animate(frames,{duration,delay,easing:'cubic-bezier(.23,1,.32,1)',fill:'backwards'});
}
function drawFarm(index, state, previous, active) {
 const {panel,tiles,field,summary,stock} = farms[index];
 panel.classList.toggle('active',active);
 tiles.forEach((tile,i) => {
  const exists = i < state.rooms;
  const wasThere = previous && i < previous.rooms;
  const artEl = tile.firstElementChild;
  artEl.src = art[state.type+'-room']; tile.classList.toggle('empty',!exists);
  if (!previous) return;
  if (exists && !wasThere) motion(artEl,[{opacity:0,transform:'translateY(-10px) scale(.86)'},{opacity:1,transform:'none'}]);
  if (exists && wasThere && state.type!==previous.type) motion(artEl,[{transform:'perspective(160px) rotateY(85deg)'},{transform:'none'}],370,i*85);
  if (!exists && wasThere) {
   const removed=img(previous.type+'-room'); Object.assign(removed.style,{position:'absolute',inset:'0',visibility:'visible'}); tile.append(removed);
   if (!reduced.matches) removed.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-12px) scale(.84)'}],{duration:320,fill:'forwards'}).finished.then(()=>removed.remove());
   else removed.remove();
  }
 });
 field.hidden=state.field===null; field.style.display=field.hidden?'none':'grid';
 field.replaceChildren(img('field'));
 for (let i=0;i<state.field;i++) {
  const seed=img('grain'); seed.className='crop'; field.append(seed);
  if (previous && previous.field!==state.field) motion(seed,[{opacity:0,transform:'translateY(-9px)'},{opacity:1,transform:'none'}],280,i*100);
 }
 const fieldText = state.field === null ? '' : state.field
   ? (english ? ' · 3 grain sown' : ' · 田里 3 谷物')
   : (english ? ' · empty field' : ' · 一块空田');
 summary.textContent = state.rooms + (english ? ' ' : ' 间') + materials[state.type] + fieldText;
 stock.replaceChildren();
 for (const [key,value] of Object.entries(state.stock)) {
  const chip=make('span','supply'); chip.dataset.resource=key;
  const amount=make('b',''); amount.textContent=value;
  chip.append(img(key),document.createTextNode(resources[key]),amount); stock.append(chip);
  if (previous && previous.stock[key]!==value) {
   chip.classList.add('changed'); motion(amount,[{transform:'translateY(-4px)',opacity:.35},{transform:'none',opacity:1}]);
  }
 }
}
function flyMeal() {
 if (reduced.matches) return;
 const board=select('.board'), base=board.getBoundingClientRect();
 const start=farms[1].stock.querySelector('[data-resource="food"]').getBoundingClientRect();
 const end=farms[0].stock.querySelector('[data-resource="food"]').getBoundingClientRect();
 const token=img('food'); token.className='food-flight';
 token.style.left=(start.x-base.x)+'px'; token.style.top=(start.y-base.y-7)+'px'; board.append(token);
 const dx=end.x-start.x, dy=end.y-start.y;
 token.animate([{transform:'translate(0,0)',opacity:.9},{transform:'translate('+dx*.55+'px,'+(dy*.55-30)+'px)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:800,easing:'ease-in-out',fill:'forwards'}).finished.then(()=>token.remove());
}
function draw(before=null) {
 const script=tracks[track], current=script[step];
 drawFarm(0,current.farms[0],before?.farms[0],current.owner===0);
 drawFarm(1,current.farms[1],before?.farms[1],current.owner===1);
 if (track==='promo' && step===4 && before===script[3]) flyMeal();
 select('h3').textContent=current.title; select('.note p').textContent=current.text;
 if (before) motion(select('.note'),[{opacity:.5,transform:'translateY(3px)'},{opacity:1,transform:'none'}],170);
 for (const fig of select('.hand').children) fig.classList.toggle('lit',current.cards.includes(fig.dataset.card));
 select('#count').textContent=english ? 'Step '+(step+1)+' of '+script.length : '第 '+(step+1)+' / '+script.length+' 步';
 select('#prev').disabled=step===0; select('#next').disabled=step===script.length-1;
 select('#play').textContent=timer ? (english?'Pause':'暂停') : step===script.length-1 ? (english?'Replay':'重播') : (english?'Play':'播放');
}
function stop() { clearTimeout(timer); timer=null; }
function setTrack(key) {
 stop(); track=Object.hasOwn(tracks,key)?key:'promo'; step=0;
 modes.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===track)));
 select('.chapter').textContent=modes.find(button=>button.dataset.mode===track).textContent;
 const hand=select('.hand'); hand.replaceChildren();
 for (const id of (track==='promo'?promoCards:['D014','D128'])) {
  const fig=make('figure',''); fig.dataset.card=id;
  const caption=make('figcaption',''); caption.textContent=names[id];
  fig.append(img(id),caption); hand.append(fig);
 }
 draw();
}
function move(to) {
 const script=tracks[track], before=script[step]; step=Math.max(0,Math.min(script.length-1,to));
 if (step===script.length-1) stop();
 draw(before);
}
function schedule() {
 timer=setTimeout(()=>{move(step+1); if(timer) schedule();},6500);
}
function togglePlay() {
 if (timer) stop();
 else {
  if (step===tracks[track].length-1) move(0);
  schedule();
 }
 draw();
}
modes.forEach(button=>button.onclick=()=>{
 const key=button.dataset.mode;
 setTrack(key);
 if (location.hash.slice(1)!==key) location.hash=key;
});
addEventListener('hashchange',()=>{
 const key = location.hash.slice(1);
 if (key!==track) setTrack(key);
});
select('#prev').onclick=()=>{stop();move(step-1);};
select('#next').onclick=()=>{stop();move(step+1);};
document.addEventListener('keydown', event => {
 if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
 const button = {'ArrowLeft':'#prev', 'ArrowRight':'#next'}[event.key];
 if (button) {
  event.preventDefault();
  select(button).click();
 }
});
select('#play').onclick=togglePlay;
document.addEventListener('visibilitychange',()=>{if(document.hidden && timer) {stop();draw();}});
select('#hammer').src=art.D014;
if (options.has('film') && !hostFrame) document.documentElement.classList.add('film');
setTrack(location.hash.slice(1));
if (hostFrame) {
 const main = select('main');
 const fitFrame = () => { hostFrame.style.height = Math.ceil(main.getBoundingClientRect().height) + 'px'; };
 fitFrame();
 new ResizeObserver(fitFrame).observe(main);
}
