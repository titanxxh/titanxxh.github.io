<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="880" viewBox="0 0 1700 880" role="img" aria-labelledby="title desc">
  <title id="title">The engine fixes the order, cards attach to phases</title>
  <desc id="desc">11 hook phases of one action; each row below is one card, gold marks are the phases it hooks</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101715"/><stop offset="0.55" stop-color="#17231f"/><stop offset="1" stop-color="#0d1312"/>
    </linearGradient>
    <linearGradient id="mainNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5e8ca"/><stop offset="1" stop-color="#e7cfa0"/></linearGradient>
    <linearGradient id="decisionNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315f56"/><stop offset="1" stop-color="#1e413b"/></linearGradient>
    <linearGradient id="accentNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7a65a"/><stop offset="1" stop-color="#b77a35"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2b26"/><stop offset="1" stop-color="#121e1b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6ad68"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca59d"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7fd4a6"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans", system-ui, sans-serif; }
      .title { fill: #f8ecd2; font-size: 44px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { fill: #b8cbc3; font-size: 22px; font-weight: 500; }
      .stage { fill: #d6ad68; font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .head { fill: #f1d7a3; font-size: 30px; font-weight: 800; }
      .head-sub { fill: #9db2aa; font-size: 18px; font-weight: 500; }
      .dark { fill: #25271f; font-size: 24px; font-weight: 750; }
      .dark-s { fill: #5c5a4d; font-size: 17px; font-weight: 600; }
      .light { fill: #fff7e4; font-size: 22px; font-weight: 750; }
      .light-s { fill: #cbe0d8; font-size: 17px; font-weight: 550; }
      .mono { fill: #fff7e4; font-size: 21px; font-weight: 750; font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; }
      .count { fill: #d6ad68; font-size: 19px; font-weight: 750; }
      .example { fill: #9db2aa; font-size: 17px; font-weight: 550; }
      .edge { fill: none; stroke: #d6ad68; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #8ca59d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowMuted); }
      .edge-green { fill: none; stroke: #7fd4a6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .bracket { fill: none; stroke: #8ca59d; stroke-width: 3; stroke-linecap: round; }
      .note { fill: #c4d4cd; font-size: 20px; }
      .pill { fill: #24352f; stroke: #50796d; stroke-width: 2; }
      .pill-text { fill: #e9f1ec; font-size: 20px; font-weight: 700; }
      .callout { fill: #1f3a33; stroke: #7fd4a6; stroke-width: 2.5; }
      .callout-text { fill: #d8f3e4; font-size: 18px; font-weight: 700; }
