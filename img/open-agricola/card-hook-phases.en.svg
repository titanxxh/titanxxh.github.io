  <rect x="891.0" y="545" width="60" height="24" rx="12" fill="url(#accentNode)" stroke="#f1d7a3" stroke-width="2"/>
  <text x="1350" y="564" text-anchor="start" class="light-s" style="font-size:13px">double food from cooking at harvest</text>
