<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
  <title id="title">Open Agricola Vibe Coding learning curve</title>
  <desc id="desc">Easier front-end work brought back the excitement of exploring. Autonomous work delivered individual features while duplication and tangled dependencies made maintenance harder. Organizing architecture, project memory, and checks connected the first project Harness.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1519"/>
      <stop offset="0.58" stop-color="#17282b"/>
      <stop offset="1" stop-color="#263b35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9bd70"/>
      <stop offset="0.48" stop-color="#df8666"/>
      <stop offset="1" stop-color="#70c6a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020606" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "Inter", "Noto Sans", system-ui, sans-serif; }
      .title { fill: #f5ead1; font-size: 48px; font-weight: 800; }
      .subtitle { fill: #a9c0b8; font-size: 23px; font-weight: 500; }
      .axis { fill: #91aaa1; font-size: 20px; font-weight: 600; }
      .stage { font-size: 29px; font-weight: 800; }
      .card-title { fill: #f8edd8; font-size: 23px; font-weight: 750; }
      .card-note { fill: #b9cec6; font-size: 17px; font-weight: 500; }
      .footer { fill: #dbc49a; font-size: 23px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1800" height="950" rx="38" fill="url(#bg)"/>
  <circle cx="1580" cy="120" r="260" fill="#efc77d" opacity="0.055"/>
  <circle cx="180" cy="790" r="280" fill="#66b99b" opacity="0.045"/>

  <text x="900" y="82" text-anchor="middle" class="title">Vibe Coding: From a Rush to a Reality Check</text>
  <text x="900" y="122" text-anchor="middle" class="subtitle">February-early June 2026: a subjective sketch of development</text>

  <path d="M105 755 L105 170 M105 755 L1690 755" fill="none" stroke="#6f8c83" stroke-width="3" opacity="0.7"/>
  <path d="M105 610 L1690 610 M105 465 L1690 465 M105 320 L1690 320" fill="none" stroke="#648078" stroke-width="2" stroke-dasharray="8 13" opacity="0.24"/>
  <text x="43" y="480" text-anchor="middle" class="axis" transform="rotate(-90 43 480)">How much I thought I controlled the project</text>
  <text x="1690" y="798" text-anchor="end" class="axis">Project progress / engineering understanding</text>

  <path d="M130 680 C280 610 360 225 545 225 C720 225 785 700 1030 704 C1240 707 1350 475 1660 315" fill="none" stroke="#050b0a" stroke-width="26" stroke-linecap="round" opacity="0.44"/>
  <path d="M130 680 C280 610 360 225 545 225 C720 225 785 700 1030 704 C1240 707 1350 475 1660 315" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="545" cy="225" r="18" fill="#efbd69" stroke="#f9e2ac" stroke-width="5"/>
  <circle cx="1030" cy="704" r="18" fill="#dc8466" stroke="#f2b49d" stroke-width="5"/>
  <circle cx="1510" cy="390" r="18" fill="#70c6a1" stroke="#b7e4d1" stroke-width="5"/>

  <text x="500" y="188" text-anchor="end" class="stage" fill="#efc477">Peak of Ignorance</text>
  <text x="1030" y="748" text-anchor="middle" class="stage" fill="#ed9b7f">Valley of Despair</text>
  <text x="1515" y="477" text-anchor="middle" class="stage" fill="#84d3b2">Slope of Enlightenment</text>

  <g filter="url(#shadow)">
    <rect x="135" y="505" width="270" height="96" rx="20" fill="#263a38" stroke="#77998e" stroke-width="3"/>
    <text x="270" y="544" text-anchor="middle" class="card-title">Front-end barrier falls</text>
    <text x="270" y="575" text-anchor="middle" class="card-note">Ideas get feedback more easily</text>
  </g>
  <path d="M328 505 L374 422" fill="none" stroke="#829f96" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="278" y="285" width="310" height="96" rx="20" fill="#3a392f" stroke="#c19b5f" stroke-width="3"/>
    <text x="433" y="324" text-anchor="middle" class="card-title">Skills help one task</text>
    <text x="433" y="355" text-anchor="middle" class="card-note">Useful with a clear task boundary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="145" width="360" height="102" rx="20" fill="#44362f" stroke="#d18b68" stroke-width="3"/>
    <text x="800" y="185" text-anchor="middle" class="card-title">Try autonomous development</text>
    <text x="800" y="217" text-anchor="middle" class="card-note">Put sleeping hours to work too</text>
  </g>
  <path d="M650 247 L620 302" fill="none" stroke="#b07d65" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="745" y="545" width="315" height="100" rx="20" fill="#472e2d" stroke="#d87868" stroke-width="3"/>
    <text x="902" y="585" text-anchor="middle" class="card-title">Works, but hard to change</text>
    <text x="902" y="617" text-anchor="middle" class="card-note">Duplication, unclear dependencies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1070" y="555" width="430" height="125" rx="20" fill="#313c38" stroke="#7a9e91" stroke-width="3"/>
    <text x="1285" y="593" text-anchor="middle" class="card-title">Organize project memory</text>
    <text x="1285" y="623" text-anchor="middle" class="card-title">for the next task</text>
    <text x="1285" y="654" text-anchor="middle" class="card-note">Consolidate docs and clarify their authority</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1310" y="185" width="430" height="102" rx="20" fill="#244139" stroke="#72bfa0" stroke-width="3"/>
    <text x="1525" y="225" text-anchor="middle" class="card-title">A connected project Harness</text>
    <text x="1525" y="257" text-anchor="middle" class="card-note">Shared mechanisms, boundaries, feedback</text>
  </g>
  <path d="M1500 287 L1508 355" fill="none" stroke="#72bfa0" stroke-width="3"/>

  <rect x="500" y="826" width="800" height="82" rx="32" fill="#101a1b" stroke="#766c59" stroke-width="2" opacity="0.94"/>
  <text x="900" y="858" text-anchor="middle" class="footer">Completed tasks do not automatically make</text>
  <text x="900" y="888" text-anchor="middle" class="footer">a project easier to maintain</text>
</svg>
