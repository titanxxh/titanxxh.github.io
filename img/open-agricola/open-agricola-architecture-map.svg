<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">规则引擎的地图</title>
  <desc id="desc">一棵节点树，围着它的四块东西</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101715"/><stop offset="0.55" stop-color="#17231f"/><stop offset="1" stop-color="#0d1312"/>
    </linearGradient>
    <linearGradient id="mainNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5e8ca"/><stop offset="1" stop-color="#e7cfa0"/></linearGradient>
    <linearGradient id="decisionNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315f56"/><stop offset="1" stop-color="#1e413b"/></linearGradient>
    <linearGradient id="accentNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7a65a"/><stop offset="1" stop-color="#b77a35"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2b26"/><stop offset="1" stop-color="#121e1b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6ad68"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca59d"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7fd4a6"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans", system-ui, sans-serif; }
      .title { fill: #f8ecd2; font-size: 44px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { fill: #b8cbc3; font-size: 22px; font-weight: 500; }
      .stage { fill: #d6ad68; font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .head { fill: #f1d7a3; font-size: 30px; font-weight: 800; }
      .head-sub { fill: #9db2aa; font-size: 18px; font-weight: 500; }
      .dark { fill: #25271f; font-size: 24px; font-weight: 750; }
      .dark-s { fill: #5c5a4d; font-size: 17px; font-weight: 600; }
      .light { fill: #fff7e4; font-size: 22px; font-weight: 750; }
      .light-s { fill: #cbe0d8; font-size: 17px; font-weight: 550; }
      .mono { fill: #fff7e4; font-size: 21px; font-weight: 750; font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; }
      .count { fill: #d6ad68; font-size: 19px; font-weight: 750; }
      .example { fill: #9db2aa; font-size: 17px; font-weight: 550; }
      .edge { fill: none; stroke: #d6ad68; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #8ca59d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowMuted); }
      .edge-green { fill: none; stroke: #7fd4a6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .bracket { fill: none; stroke: #8ca59d; stroke-width: 3; stroke-linecap: round; }
      .note { fill: #c4d4cd; font-size: 20px; }
      .pill { fill: #24352f; stroke: #50796d; stroke-width: 2; }
      .pill-text { fill: #e9f1ec; font-size: 20px; font-weight: 700; }
      .callout { fill: #1f3a33; stroke: #7fd4a6; stroke-width: 2.5; }
      .callout-text { fill: #d8f3e4; font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="38" fill="url(#background)"/>
  <text x="800" y="76" text-anchor="middle" class="title">规则引擎的地图</text>
  <text x="800" y="116" text-anchor="middle" class="subtitle">一棵节点树，围着它的四块东西</text>
  <g filter="url(#shadow)">  <rect x="470" y="300" width="660" height="400" rx="30" fill="url(#panel)" stroke="#76a99b" stroke-width="3" />
</g>
  <text x="800.0" y="346" text-anchor="middle" class="mono" style="font-size:26px">engine/</text>
  <text x="800.0" y="376" text-anchor="middle" class="head-sub">节点树引擎</text>
  <rect x="477.0" y="400" width="118" height="46" rx="12" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="536.0" y="430" text-anchor="middle" class="mono" style="font-size:15px">ActionNode</text>
  <rect x="609.0" y="400" width="118" height="46" rx="12" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="668.0" y="430" text-anchor="middle" class="mono" style="font-size:15px">SequenceNode</text>
  <rect x="741.0" y="400" width="118" height="46" rx="12" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="800.0" y="430" text-anchor="middle" class="mono" style="font-size:15px">ParallelNode</text>
  <rect x="873.0" y="400" width="118" height="46" rx="12" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="932.0" y="430" text-anchor="middle" class="mono" style="font-size:15px">XorNode</text>
  <rect x="1005.0" y="400" width="118" height="46" rx="12" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="1064.0" y="430" text-anchor="middle" class="mono" style="font-size:15px">OrNode</text>
  <text x="800.0" y="472" text-anchor="middle" class="light-s">运行时只有这五种节点</text>
  <text x="800.0" y="498" text-anchor="middle" class="light-s">跨玩家 · 可选 · 强制 · 等待输入：都是节点上的标记</text>
  <rect x="510" y="522" width="280" height="70" rx="16" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
  <text x="650" y="550" text-anchor="middle" class="mono" style="font-size:18px">EngineStack</text>
  <text x="650" y="576" text-anchor="middle" class="light-s" style="font-size:14px">子流程栈：嵌套的流程都压在这里</text>
  <g filter="url(#shadow)">  <rect x="810" y="522" width="280" height="70" rx="16" fill="url(#mainNode)" stroke="#d6ad68" stroke-width="3" />
</g>
  <text x="950" y="550" text-anchor="middle" class="dark" style="font-size:20px">action leaf</text>
  <text x="950" y="576" text-anchor="middle" class="dark-s" style="font-size:15px">整个引擎里只有它写状态</text>
  <text x="800.0" y="652" text-anchor="middle" class="light-s">events：每个行动一个事务，成功才提交；日志只是派生缓存</text>
  <g filter="url(#shadow)">  <rect x="520" y="168" width="560" height="84" rx="20" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
</g>
  <text x="800" y="202" text-anchor="middle" class="mono">session/</text>
  <text x="800" y="232" text-anchor="middle" class="light-s">GameCore：回合、收获、计分的阶段推进</text>
  <path class="edge" d="M800 252 L800 298"/>
  <g filter="url(#shadow)">  <rect x="70" y="400" width="340" height="140" rx="20" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
</g>
  <text x="240" y="440" text-anchor="middle" class="mono">actions/</text>
  <text x="240" y="474" text-anchor="middle" class="light-s">行动定义与支付算法</text>
  <text x="240" y="502" text-anchor="middle" class="light-s">11 个可以挂东西的时点</text>
  <path class="edge" d="M410 470 L468 470"/>
  <g filter="url(#shadow)">  <rect x="1190" y="400" width="340" height="140" rx="20" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
</g>
  <text x="1360" y="440" text-anchor="middle" class="mono">cards/</text>
  <text x="1360" y="474" text-anchor="middle" class="light-s">Card Source，一张牌一个文件</text>
  <text x="1360" y="502" text-anchor="middle" class="light-s">定义字段 · listener · effect</text>
  <path class="edge" d="M1190 470 L1132 470"/>
  <path class="edge" d="M800 700 L800 746"/>
  <g filter="url(#shadow)">  <rect x="520" y="748" width="560" height="84" rx="20" fill="url(#decisionNode)" stroke="#76a99b" stroke-width="3" />
</g>
  <text x="800" y="782" text-anchor="middle" class="mono">domain/</text>
  <text x="800" y="812" text-anchor="middle" class="light-s">农场、动物、田地、计分</text>
  <text x="800" y="872" text-anchor="middle" class="note">以上全在 shared/，前后端共用；服务端的 GameSession 是唯一写入者，前端只渲染</text>
  <text x="800" y="918" text-anchor="middle" class="stage">和引擎直接相关的三条不变量</text>
  <rect class="pill" x="418" y="938" width="300" height="46" rx="23"/>
  <text x="568.0" y="969" text-anchor="middle" class="pill-text">节点树唯一状态机</text>
  <rect class="pill" x="740" y="938" width="180" height="46" rx="23"/>
  <text x="830.0" y="969" text-anchor="middle" class="pill-text">卡牌闭环</text>
  <rect class="pill" x="942" y="938" width="240" height="46" rx="23"/>
  <text x="1062.0" y="969" text-anchor="middle" class="pill-text">后端唯一写入者</text>
</svg>
